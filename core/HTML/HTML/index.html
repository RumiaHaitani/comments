<!DOCTYPE html>
<!-- 1. Корневой элемент, язык страницы — русский -->
<html lang="ru">
<head>
    <!-- 2. Кодировка символов -->
    <meta charset="UTF-8">
    <!-- 3. Настройка адаптивности для мобильных устройств -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 4. Заголовок вкладки браузера -->
    <title>Selectel Bank Simulator</title>
    <!-- 5. Подключение внешнего CSS-файла -->
    <link rel="stylesheet" href="../CSS/index.css"> 
</head>
<body>
    <!-- 6. Шапка сайта: логотип и виджет погоды -->
    <header>
        <div class="logo">SELECTEL BANK</div>
        <div class="weather-widget" id="weather-display">Загрузка погоды...</div>
    </header>
    <!-- 7. Основной контент страницы -->
    <main>
        <div class="dashboard">
            <!-- 8. Карточка счёта и карточка имитации платежа -->
            <div class="card">
                <h2>Ваш счет</h2>
                <div class="balance" id="balance-amount">50 000.00 ₽</div>
                <p style="color: var(--text-muted)">Лимит по операциям: 500 000 ₽</p>
            </div>
            <div class="card">
                <h2>Имитация платежа</h2>
                <form id="payment-form">
                    <div class="form-group">
                        <label for="bank-select">Выберите банк-эквайер</label>
                        <select id="bank-select">
                            <option value="SBER">Сбербанк API</option>
                            <option value="TINKOFF">Т-Банк API</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="amount-input">Сумма перевода (₽)</label>
                        <input type="number" id="amount-input" min="1" placeholder="Введите сумму" required>
                    </div>
                    <button type="submit">Провести платеж</button>
                </form>
            </div>
            <!-- 9. Карточка с логами сервера и транзакций -->
            <div class="card" style="grid-column: 1 / -1;">
                <h2>Логи сервера и транзакций</h2>
                <div class="logs" id="log-console"></div>
            </div>
        </div>
    </main>
    <!-- 10. Подключение внешнего JavaScript-файла -->
    <script src="../JS/index.js"></script>
</body>
</html>
